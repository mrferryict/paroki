; public/.user.ini — PHP production defaults (LiteSpeed / cPanel shared hosting)
; Perubahan biasanya aktif setelah ~5 menit (user_ini.cache_ttl).
; Selaraskan upload_max_filesize dengan validasi app (berita/galeri max 2048 KB).

display_errors = Off
log_errors = On
upload_max_filesize = 2M
post_max_size = 8M
memory_limit = 128M
max_execution_time = 60

; Uncomment dan sesuaikan path akun hosting jika host mengizinkan open_basedir via .user.ini:
; open_basedir = "/home/USERNAME/paroki/public:/home/USERNAME/paroki/writable:/tmp"
