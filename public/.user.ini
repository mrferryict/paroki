; public/.user.ini — PHP production (LiteSpeed / cPanel shared hosting)
; Perubahan biasanya aktif setelah ~5 menit (user_ini.cache_ttl).
; Selaraskan dengan PHP Selector: upload 32M, post 32M, memory 256M.

display_errors = Off
log_errors = On
date.timezone = Asia/Jakarta

upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Uncomment dan sesuaikan path akun hosting jika host mengizinkan open_basedir via .user.ini:
; open_basedir = "/home/USERNAME/paroki/public:/home/USERNAME/paroki/writable:/tmp"
